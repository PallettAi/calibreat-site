<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="100%" height="100%" role="img" aria-label="calibrEAT lockup">
  <!-- Flat balance mark (scale 0.34 of the tile mark, no tile) -->
  <g transform="translate(24, 6) scale(0.34)">
    <!-- Fulcrum base -->
    <path d="M 220 370 L 292 370 L 272 335 L 240 335 Z" fill="#1F9D55"/>
    <rect x="206" y="370" width="100" height="12" rx="6" fill="#1F9D55"/>
    <!-- 'C' monogram -->
    <path d="M 315 185 A 75 75 0 1 0 315 315" fill="none" stroke="#1F9D55" stroke-width="26" stroke-linecap="round"/>
    <!-- Balance beam -->
    <line x1="130" y1="315" x2="382" y2="245" stroke="#0B1220" stroke-width="14" stroke-linecap="round"/>
    <!-- Apple (input) -->
    <g transform="translate(135, 220)">
      <path d="M 25 12 C 32 3, 42 8, 42 8 C 42 8, 38 20, 25 12 Z" fill="#0E6B38"/>
      <path d="M 25 20 C 10 20, 5 33, 5 50 C 5 72, 20 82, 25 82 C 30 82, 45 72, 45 50 C 45 33, 40 20, 25 20 Z" fill="#1F9D55"/>
    </g>
    <!-- Flame (output) -->
    <g transform="translate(335, 150)">
      <path d="M 25 75 C 10 75, 0 62, 0 45 C 0 28, 15 15, 25 0 C 30 18, 40 25, 40 42 C 40 60, 35 75, 25 75 Z" fill="#1F9D55"/>
      <path d="M 25 75 C 18 75, 12 68, 12 55 C 12 42, 22 32, 25 25 C 28 35, 33 40, 33 52 C 33 65, 30 75, 25 75 Z" fill="#B7E93C"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="188" y="131" font-family="Inter, 'Spline Sans', system-ui, -apple-system, sans-serif" font-size="88" font-weight="800" letter-spacing="-2">
    <tspan fill="#0B1220">calibr</tspan><tspan fill="#1F9D55">EAT</tspan>
  </text>
</svg>
