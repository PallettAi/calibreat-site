name = "calibreat-license"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# Stable custom domain (DNS + cert are provisioned automatically by wrangler
# on deploy). Requires the calibreat.co.uk zone in this Cloudflare account.
# workers_dev stays TRUE: shipped APKs (≤ v0.0.4) have the workers.dev URL
# baked in, so it must keep answering until the custom domain is baked into a
# future build.
workers_dev = true
routes = [
  { pattern = "api.calibreat.co.uk", custom_domain = true }
]

# The whole license DB lives in one Durable Object instance (SQLite-backed,
# included on the Workers Free plan). Single writer = simple, correct store.
[durable_objects]
bindings = [{ name = "LICENSE_STORE", class_name = "LicenseStoreDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LicenseStoreDO"]

# Daily license-store backup: the cron fires `scheduled` (src/worker.ts), which
# exports every license + activation to the R2 bucket below.
[triggers]
crons = ["0 3 * * *"]

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "calibreat-license-backups"

# Non-secret tuning (defaults shown). Secrets — RESEND_API_KEY, EMAIL_FROM,
# MOR_WEBHOOK_SECRET, DODO_WEBHOOK_SECRET, DODO_API_KEY, ADMIN_TOKEN — go in
# `wrangler secret put <NAME>`.
[vars]
OTP_TTL_MS = "600000"
REQUEST_COOLDOWN_MS = "30000"
MAX_OTP_ATTEMPTS = "5"
MAX_OTP_SENDS = "8"
OTP_SEND_WINDOW_MS = "3600000"
DODO_API_BASE = "https://live.dodopayments.com"