name = "calibreat-uptime"
main = "src/uptime-worker.ts"
compatibility_date = "2026-09-01"

# Self-hosted watchdog: checks the marketing site every 5 minutes and emails
# only on state changes. Secrets (RESEND_API_KEY, ALERT_TO, ALERT_FROM,
# ADMIN_TOKEN) go to THIS worker via:
#   npx wrangler secret put <NAME> -c wrangler.uptime.toml
[triggers]
crons = ["*/5 * * * *"]

# State (uptime/state.json) lives in an existing R2 bucket, kept from the
# retired licence service so its history is not lost.
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "calibreat-license-backups"
