name: Deploy website to Cloudflare Pages

# PARKED — manual only, on purpose. The site stays on GitHub Pages; the full
# reasoning and the measurements behind it are in docs/site-hosting.md.
#
# The move was started because share-card previews were blank and the theory was
# that X's crawler refuses redirects, so the site had to answer 200 on http://.
# Measurement disproved it: every form of the URL is a single hop, the crawler
# follows one redirect, and *.pages.dev 301s http:// exactly the same way — so
# Cloudflare gives the crawler an identical experience. The blank card was the
# two-day window where the pages declared a card with no og:image (see the git
# history around 32d38e7) plus X's per-URL cache.
#
# Kept because the one real benefit survives: GitHub Pages cannot send response
# headers, so the Content-Security-Policy in apps/web/_headers can only ship from
# a host like this one. Two repository secrets switch it back on, and the step
# below provisions its own Pages project, so no dashboard setup is needed first.

on:
  # Deliberately manual: parked work should never run, or nag, on a push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Same gate as the GitHub Pages workflow — never publish a broken site.
      - name: Static site checks
        run: node scripts/check-site.mjs

      # Cloudflare credentials are a one-time setup step (docs/site-hosting.md).
      # Until they exist, skip the deploy instead of failing every push: a red
      # workflow people learn to ignore is worse than no workflow.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Cloudflare deploy skipped::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys — see docs/site-hosting.md"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      # Provisioning the project here keeps setup to two secrets and nothing
      # else: the first deploy creates `calibreat-site`, later runs find it and
      # move on. (Without this, the project had to be created by hand before the
      # workflow could ever succeed — a prerequisite that is easy to miss and
      # fails the deploy with a confusing "project not found".)
      - name: Ensure the Pages project exists
        if: steps.creds.outputs.skip != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project=calibreat-site
          if npx --yes wrangler@4 pages project list | grep -qw "$project"; then
            echo "Pages project '$project' already exists - nothing to create."
            exit 0
          fi
          echo "Creating Pages project '$project'."
          npx --yes wrangler@4 pages project create "$project" --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.skip != '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No build step: apps/web is hand-written static HTML.
          command: pages deploy apps/web --project-name=calibreat-site --branch=main
