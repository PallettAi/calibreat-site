name: Checks

# Everything the repo can verify without a device: the app's logic suites,
# lint and types, the license API's tests, and the static site's integrity.
# The site deploy workflow only cares about apps/web — this one guards main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static site checks
        run: node scripts/check-site.mjs

  api:
    name: License API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      # The gate: tsc + every scripts/check-*.mjs suite.
      - run: npm run check
      # Non-blocking for now: 12 pre-existing react-hooks errors (setState in
      # effect, refs read during render) live in the screens. Flip this to
      # blocking once they are cleared — `npm run verify` runs everything.
      - run: npm run lint
        continue-on-error: true
