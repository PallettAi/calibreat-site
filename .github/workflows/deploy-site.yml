name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# NOTE — Content-Security-Policy: the CSP is NOT in the HTML. Meta-tag CSP is
# ignored for `frame-ancestors` and logs a console warning on every page load.
# It must be delivered as an HTTP header. GitHub Pages cannot send custom
# response headers, so full CSP on production currently requires moving the
# site to a host that can (e.g. Cloudflare Pages or Workers with a
# _headers-equivalent). Until then, pages rely on the remaining meta
# protections (referrer, nosniff) plus header-based CSP wherever the site is
# served by something we control (see apps/web/serve.py for local/preview).
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4