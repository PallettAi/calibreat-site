name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# This is the live host. A move to Cloudflare Pages was measured and parked: the
# redirect theory behind it did not survive testing (see docs/site-hosting.md).
#
# One real limitation remains, and it is not a bug anyone will notice: GitHub
# Pages cannot send response headers, so the Content-Security-Policy in
# apps/web/_headers does not ship from here (a meta-tag CSP is ignored for
# `frame-ancestors` and warns on every page load). If that is ever worth a host
# move, deploy-cloudflare.yml is parked on manual dispatch and ready.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4