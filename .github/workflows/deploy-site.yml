name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# NOTE — this workflow is now the FALLBACK host. The site is moving to
# Cloudflare Pages (deploy-cloudflare.yml) for two reasons: link-preview
# crawlers do not follow redirects and GitHub Pages 301s every http:// request,
# which broke every share card; and GitHub Pages cannot send custom response
# headers, so the Content-Security-Policy could never ship as a real header
# (a meta-tag CSP is ignored for `frame-ancestors`). The policy now lives in
# apps/web/_headers; see docs/site-hosting.md for the cutover.
#
# Kept running until the DNS cutover so both hosts stay in sync and the switch
# is reversible. After cutover: delete this file and apps/web/CNAME.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4