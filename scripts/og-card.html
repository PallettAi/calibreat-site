<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>calibrEAT OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a1019; }
  body {
    font-family: Inter, system-ui, sans-serif;
    color: #eef2f5;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 20%, #000 30%, transparent 75%);
    mask-image: radial-gradient(ellipse 90% 80% at 50% 20%, #000 30%, transparent 75%);
  }
  .glow {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(720px 420px at 82% 8%, rgba(31,157,85,.38), transparent 62%),
      radial-gradient(560px 400px at 8% 92%, rgba(183,233,60,.12), transparent 62%);
  }
  .frame {
    position: relative;
    height: 630px;
    padding: 64px 72px;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 64px;
    align-items: center;
  }
  .mark {
    width: 280px; height: 280px;
    display: grid; place-items: center;
  }
  .mark svg { width: 260px; height: 260px; }
  .copy { min-width: 0; }
  .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #b7e93c;
    margin-bottom: 18px;
  }
  .kicker::before {
    content: ""; width: 22px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, #1f9d55, #b7e93c);
  }
  h1 {
    font-family: Sora, Inter, sans-serif;
    font-weight: 800;
    font-size: 72px;
    letter-spacing: -.04em;
    line-height: .92;
    margin: 0 0 18px;
  }
  h1 .e { color: #b7e93c; }
  .lede {
    font-family: Sora, Inter, sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: -.03em;
    line-height: 1.12;
    color: #fff;
    margin: 0 0 22px;
    max-width: 640px;
  }
  .lede em { color: #b7e93c; font-style: normal; }
  .sub {
    font-size: 20px; line-height: 1.45; color: #a7b2bc; font-weight: 500;
    margin: 0 0 28px;
  }
  .pills { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill {
    font-size: 15px; font-weight: 600; color: #eef2f5;
    border: 1px solid rgba(183,233,60,.28);
    background: rgba(31,157,85,.12);
    border-radius: 999px; padding: 8px 14px;
  }
  .domain {
    position: absolute; right: 72px; bottom: 36px;
    font-size: 16px; font-weight: 600; letter-spacing: .04em; color: #7d8a96;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="frame">
    <div class="mark" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <path d="M 220 370 L 292 370 L 272 335 L 240 335 Z" fill="#B7E93C"/>
        <rect x="206" y="370" width="100" height="12" rx="6" fill="#B7E93C"/>
        <path d="M 315 185 A 75 75 0 1 0 315 315" fill="none" stroke="#B7E93C" stroke-width="22" stroke-linecap="round"/>
        <line x1="130" y1="315" x2="382" y2="245" stroke="#B7E93C" stroke-width="12" stroke-linecap="round"/>
        <g transform="translate(135, 220)">
          <path d="M 25 12 C 32 3, 42 8, 42 8 C 42 8, 38 20, 25 12 Z" fill="#B7E93C"/>
          <path d="M 25 20 C 10 20, 5 33, 5 50 C 5 72, 20 82, 25 82 C 30 82, 45 72, 45 50 C 45 33, 40 20, 25 20 Z" fill="#1F9D55"/>
        </g>
        <g transform="translate(335, 150)">
          <path d="M 25 75 C 10 75, 0 62, 0 45 C 0 28, 15 15, 25 0 C 30 18, 40 25, 40 42 C 40 60, 35 75, 25 75 Z" fill="#1F9D55"/>
          <path d="M 25 75 C 18 75, 12 68, 12 55 C 12 42, 22 32, 25 25 C 28 35, 33 40, 33 52 C 33 65, 30 75, 25 75 Z" fill="#B7E93C"/>
        </g>
      </svg>
    </div>
    <div class="copy">
      <div class="kicker">£4.99 · lifetime · no subscription</div>
      <h1>calibr<span class="e">EAT</span></h1>
      <p class="lede">Your eating, precisely <em>calibrated</em>.</p>
      <p class="sub">Log food · Scan barcodes · Track water &amp; weight<br />No ads · Data stays on your phone</p>
      <div class="pills">
        <span class="pill">One-time £4.99</span>
        <span class="pill">Android 8.0+</span>
      </div>
    </div>
  </div>
  <div class="domain">calibreat.co.uk</div>
</body>
</html>
